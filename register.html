<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТРИЗНЕС — вход в Игру</title>
  <style>
    :root{color-scheme:dark;--bg:#090a10;--panel:#121024;--cyan:#00f3ff;--pink:#ff007f;--muted:#98a2b3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#25183d 0,transparent 38%),radial-gradient(circle at 80% 90%,#07313a 0,transparent 36%),var(--bg);font-family:Inter,system-ui,sans-serif;color:#fff;padding:20px}.card{width:min(520px,100%);padding:28px;border:1px solid rgba(0,243,255,.3);border-radius:28px;background:rgba(18,16,36,.86);box-shadow:0 25px 80px rgba(0,0,0,.45)}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}h1{margin:10px 0 8px;font-size:30px}p{color:#c6cad2;line-height:1.55}.grid{display:grid;gap:12px;margin-top:22px}input,select,button{width:100%;border-radius:14px;padding:13px 14px;font:inherit}input,select{background:#0b0d16;border:1px solid rgba(255,255,255,.12);color:#fff}button{border:1px solid rgba(255,0,127,.55);background:rgba(255,0,127,.13);color:#ff74b9;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.small{font-size:12px;color:var(--muted)}#result{display:none;margin-top:18px;padding:16px;border:1px solid rgba(0,243,255,.25);border-radius:16px;background:rgba(0,243,255,.07)}.code{font-family:ui-monospace,monospace;color:var(--cyan);font-weight:800}.error{color:#ff8bab}</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">ТРИЗНЕС / АПОЛЛОН</div>
    <h1>Вход в Игру</h1>
    <p>Ты входишь не в курс, а в живую Игру ТРИЗНЕС. Аполлон создаст профиль игрока, сохранит точку старта и откроет первый уровень — <strong>ПЕРСОНАЖ</strong>.</p>
    <form id="form" class="grid">
      <input id="name" name="name" required minlength="2" maxlength="80" autocomplete="name" placeholder="Как тебя называть в Игре?">
      <select id="role" name="role"><option>Игрок</option><option>Персонаж</option><option>Сообщество</option></select>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Email — необязательно">
      <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Телефон — необязательно">
      <input id="website" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-10000px" aria-hidden="true">
      <button id="submit" type="submit">Войти в Игру</button>
      <div class="small">Контакт можно не оставлять. Он нужен только если ты хочешь связать этот игровой профиль с дальнейшим входом на площадку.</div>
    </form>
    <section id="result"></section>
  </main>
<script>
const ENDPOINT='https://bbxhhtpmbtgfaxamgksf.supabase.co/functions/v1/apollon-register';
const form=document.getElementById('form'),result=document.getElementById('result'),submit=document.getElementById('submit');
let clientId=localStorage.getItem('triznes-player-client-id')||'';
form.addEventListener('submit',async(e)=>{e.preventDefault();submit.disabled=true;submit.textContent='Аполлон регистрирует…';result.style.display='none';try{const payload={name:form.name.value.trim(),role:form.role.value,email:form.email.value.trim(),phone:form.phone.value.trim(),website:form.website.value,client_id:clientId};const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'registration_failed');clientId=d.client_id;localStorage.setItem('triznes-player-client-id',clientId);localStorage.setItem('triznes-player-id',d.player.id);localStorage.setItem('triznes-registration-code',d.player.registration_code);result.innerHTML=`<strong>Ты в Игре ✓</strong><p>Игрок: ${escapeHtml(d.player.display_name)}<br>Код: <span class="code">${escapeHtml(d.player.registration_code)}</span><br>Уровень ${d.game.level.level_no}: <strong>${escapeHtml(d.game.level.title)}</strong></p><p>${escapeHtml(d.game.current_mission||'')}</p>`;result.style.display='block';}catch(err){result.innerHTML=`<strong class="error">Регистрация не завершилась.</strong><p class="small">${escapeHtml(String(err.message||err))}</p>`;result.style.display='block';}finally{submit.disabled=false;submit.textContent='Войти в Игру';}});
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script>
</body>
</html>
