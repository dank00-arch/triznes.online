<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>TRIZNES SIGN</title><style>:root{color-scheme:dark;--bg:#08090d;--panel:#11131a;--line:rgba(255,255,255,.14);--muted:#9da4ad;--cyan:#62efff;--ok:#7fffb2;--err:#ff8ca7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(98,239,255,.11),transparent 32%),var(--bg);color:#f5f6f8;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(850px,calc(100% - 28px));margin:auto;padding:34px 0 70px}.brand{font-weight:950;letter-spacing:.17em;font-size:13px;margin-bottom:24px}.brand b{color:var(--cyan)}.panel{border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.04);padding:24px;margin-top:14px}.eyebrow{font:800 10px ui-monospace,monospace;color:var(--cyan);letter-spacing:.16em}h1{font-size:clamp(34px,7vw,58px);line-height:.98;letter-spacing:-.04em;margin:10px 0}h2{margin:0 0 8px}.muted{color:var(--muted)}input,button{font:inherit}input{width:100%;border:1px solid var(--line);background:#0b0d12;color:white;border-radius:12px;padding:12px}button{border:0;border-radius:12px;padding:12px 15px;background:linear-gradient(120deg,#eff1f4,#929aa6);color:#090a0f;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}.hash,.phrase{font:800 12px ui-monospace,monospace;word-break:break-all;padding:11px;border:1px dashed rgba(255,255,255,.22);border-radius:11px}.hash{color:var(--cyan)}.terms{display:grid;gap:9px;margin-top:16px}.term{border-left:2px solid rgba(98,239,255,.45);padding-left:11px}.term b{display:block;font-size:12px}.warn{border:1px solid rgba(255,210,100,.3);background:rgba(255,210,100,.06);color:#f2dfaa;padding:11px;border-radius:11px;margin-top:14px}.success{color:var(--ok);font-weight:800}.error{color:var(--err);font-weight:800}.hidden{display:none!important}@media(max-width:600px){.row{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><div class="wrap"><div class="brand">TRIZNES <b>SIGN</b></div><section class="panel"><div class="eyebrow">PERSONAL ELECTRONIC SIGNATURE</div><h1>Подпись договора</h1><p class="muted">Ссылка персональная. Введи шестизначный код из сообщения TRIZNES Bot. После проверки увидишь точную версию договора и её SHA‑256.</p><div id="verify"><div class="row"><input id="otp" inputmode="numeric" maxlength="6" placeholder="Код из Telegram"><button id="open">Открыть договор</button></div><div id="verifyStatus" class="muted" style="margin-top:8px"></div></div></section><section id="contract" class="panel hidden"></section></div><script>const API='https://bbxhhtpmbtgfaxamgksf.supabase.co/functions/v1/triznes-contract-sign',q=new URLSearchParams(location.hash.replace(/^#/,'')),invite=q.get('invite')||'',el=id=>document.getElementById(id);let current=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(action,p={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,invite_token:invite,otp:el('otp').value.trim(),...p})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}function label(k){return({commercial_rule:'Коммерческое правило',silk_road:'Великий Шёлковый путь',pink_noize_default_executor:'Production',promoted_party_future_income:'Будущие доходы',role:'Роль',investment_separate:'Инвестиции',multiple_executors:'Несколько исполнителей',rule:'Правило 50/50',silver_card_rule:'Silver',own_theatre_revenue:'Собственные доходы'}[k]||k.replaceAll('_',' '))}function draw(c){current=c;const terms=c.snapshot?.terms||{},std=c.snapshot?.standard_clauses||{};const list=Object.entries(terms).filter(([k])=>k!=='protocol').map(([k,v])=>`<div class="term"><b>${esc(label(k))}</b>${esc(typeof v==='boolean'?(v?'Да':'Нет'):v)}</div>`).join('');const standard=[['Распределение',std.commercial_split],['База расчёта',std.default_base],['Инвестиции',std.investment_exception],['Электронная подпись',std.simple_esign],['Выплаты',std.payout_gate]].filter(x=>x[1]).map(x=>`<div class="term"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('');el('contract').innerHTML=`<div class="eyebrow">${esc(c.agreement_code)} · V${esc(c.version)}</div><h2>${esc(c.title)}</h2><p>Сторона: <b>${esc(c.party_name)}</b><br>Роль: ${esc(c.party_role)}</p><div class="hash">SHA-256: ${esc(c.snapshot_sha256)}</div><div class="terms">${list}${standard}</div>${!c.legal_details_complete?'<div class="warn">Юридические реквизиты этой стороны ещё не заполнены полностью. Эта подпись фиксирует принятие протокола, но сама по себе не разблокирует денежные выплаты или инвестиционный капитал.</div>':''}<div style="margin-top:18px"><div class="muted">Для подписи введи точно:</div><div class="phrase">${esc(c.sign_phrase)}</div><div class="row"><input id="confirm" placeholder="${esc(c.sign_phrase)}"><button id="sign">Подписать</button></div><div id="signStatus" class="muted" style="margin-top:8px"></div></div>`;el('contract').classList.remove('hidden');el('sign').onclick=sign}async function preview(){const b=el('open'),s=el('verifyStatus');b.disabled=true;s.className='muted';s.textContent='Проверяю код…';try{const d=await call('preview');draw(d.contract);s.className='success';s.textContent='Личность и версия договора подтверждены.'}catch(e){s.className='error';s.textContent=e.message==='code_invalid'?'Неверный код.':e.message}finally{b.disabled=false}}async function sign(){const b=el('sign'),s=el('signStatus');b.disabled=true;s.className='muted';s.textContent='Фиксирую подпись…';try{const d=await call('sign',{confirmation:el('confirm').value});s.className='success';s.textContent=d.result?.fully_signed?'Подпись зафиксирована. Все обязательные стороны подписали эту версию ✓':'Подпись зафиксирована ✓. Ожидаются подписи остальных сторон.';b.remove()}catch(e){s.className='error';s.textContent=e.message==='confirmation_phrase_mismatch'?'Фраза подписи не совпадает с хэшем договора.':e.message;b.disabled=false}}el('open').onclick=preview;if(!invite){el('verifyStatus').className='error';el('verifyStatus').textContent='В ссылке нет персонального приглашения.';el('open').disabled=true}</script></body></html>
