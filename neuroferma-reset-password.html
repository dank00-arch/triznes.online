<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09040f">
<title>TRIZNES · Новый пароль</title>
<style>
:root{color-scheme:dark;--bg:#07040b;--panel:#100d16;--line:#32263d;--muted:#a69dad;--cyan:#42ecff;--pink:#ff35c8;--lime:#caff39;--green:#72ffad;--red:#ff7895}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 13% 0,rgba(255,53,200,.18),transparent 30%),radial-gradient(circle at 90% 5%,rgba(66,236,255,.14),transparent 28%),var(--bg);color:#f8f7fb;font:15px/1.45 system-ui,-apple-system,sans-serif}.card{width:min(520px,100%);border:1px solid var(--line);background:rgba(16,13,22,.97);border-radius:24px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.ey{font:900 10px ui-monospace,monospace;letter-spacing:.18em;color:var(--cyan)}h1{font-size:34px;line-height:1;margin:8px 0 10px;letter-spacing:-.04em}.muted{color:var(--muted)}label{display:block;margin:14px 0 6px;font-weight:800}input{width:100%;border:1px solid #3b3045;background:#08070c;color:#fff;border-radius:12px;padding:13px;font:inherit}button,a.btn{width:100%;min-height:50px;border:0;border-radius:13px;margin-top:12px;padding:0 16px;background:linear-gradient(110deg,var(--pink),var(--cyan));color:#05070a;font-weight:1000;font:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.secondary{background:#17131d!important;color:#fff!important;border:1px solid #3b3045!important}.status{margin-top:14px;padding:12px;border-radius:12px;background:#09070d;border:1px solid #30273a}.ok{border-color:rgba(114,255,173,.45);color:var(--green)}.bad{border-color:rgba(255,120,149,.45);color:var(--red)}.hide{display:none!important}.small{font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main class="card">
<div class="ey">TRIZNES / NEUROFERMA</div>
<h1>Новый пароль</h1>
<p class="muted" id="intro">Проверяю ссылку восстановления…</p>
<form id="form" class="hide">
<label for="p1">Новый пароль</label>
<input id="p1" type="password" autocomplete="new-password" minlength="10" required placeholder="Минимум 10 символов">
<label for="p2">Повтори пароль</label>
<input id="p2" type="password" autocomplete="new-password" minlength="10" required placeholder="Повтори новый пароль">
<button id="save" type="submit">Сохранить новый пароль</button>
</form>
<div id="status" class="status hide"></div>
<a id="open" class="btn secondary hide" href="./neuroferma-admin.html">Открыть Нейроферму</a>
<p class="muted small">Пароль передаётся напрямую в Supabase Auth и не сохраняется на странице TRIZNES.</p>
</main>
<script>
const AUTH='https://bbxhhtpmbtgfaxamgksf.supabase.co/auth/v1';
const KEY='sb_publishable_aFTiVGlsJxeeutL_gEZaKA_S9VyKaHS';
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const accessToken=hash.get('access_token')||'';
const type=hash.get('type')||'';
const err=hash.get('error_description')||hash.get('error')||'';
const form=document.getElementById('form'),intro=document.getElementById('intro'),status=document.getElementById('status'),openBtn=document.getElementById('open'),save=document.getElementById('save');
function show(msg,ok=false){status.textContent=msg;status.className='status '+(ok?'ok':'bad');}
if(err){intro.textContent='Ссылка восстановления не сработала.';show(decodeURIComponent(err));}
else if(!accessToken){intro.textContent='В этой ссылке нет активной recovery-сессии.';show('Запроси новое письмо восстановления и открой именно самую свежую ссылку.');}
else {
  intro.textContent=type==='recovery'?'Ссылка подтверждена. Задай новый пароль.':'Сессия подтверждена. Задай новый пароль.';
  form.classList.remove('hide');
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<10){show('Пароль должен быть не короче 10 символов.');return}
  if(p1!==p2){show('Пароли не совпадают.');return}
  save.disabled=true;save.textContent='Сохраняю…';status.classList.add('hide');
  try{
    const r=await fetch(AUTH+'/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+accessToken},body:JSON.stringify({password:p1})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||'Не удалось обновить пароль');
    form.classList.add('hide');intro.textContent='Готово.';show('Пароль успешно обновлён. Теперь можно открыть Нейроферму.',true);openBtn.classList.remove('hide');
    history.replaceState(null,'',location.pathname);
  }catch(e){show(String(e.message||e));save.disabled=false;save.textContent='Сохранить новый пароль'}
});
</script>
</body>
</html>
