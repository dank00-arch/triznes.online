<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07040B" />
  <title>TRIZNES · Карта локаций, событий и маршрутов Сочи</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="/src/styles/triznes-unified.css" />
</head>
<body>
  <header class="tz-header">
    <div class="tz-header-inner">
      <a class="tz-brand" href="/entry.html"><span class="tz-brand-title">TRIZNES · SOCHI MATRIX</span></a>
      <nav class="tz-nav">
        <a class="tz-btn" href="/entry.html">Портал</a>
        <a class="tz-btn" href="/home.html">Кокпит</a>
        <a class="tz-btn" href="/sochiwood/index.html">Кинозал</a>
      </nav>
    </div>
  </header>


  <main class="tz-main">
    <section class="tz-card">
      <div style="font:800 10px/1.2 var(--tz-font-body);letter-spacing:0.18em;color:#FFD700;">РЕАЛЬНЫЙ СОЧИ · МЕДИАХАБ И ИГРОВЫЕ МАРШРУТЫ</div>
      <h1 style="font-family:var(--tz-font-display);font-size:clamp(22px,4vw,34px);margin:6px 0 8px;">Локации, события и точки маршрута</h1>
      <p style="margin:0;font-size:14px;color:var(--tz-muted);">Только подтверждённые физические локации Сочи: Медиахаб на Приморской 6/4, Навагинская, Морской вокзал и Театр ТУЗ.</p>
    </section>


    <section class="tz-grid-2" id="locationsGrid"></section>
  </main>


  <nav class="tz-mobile-dock">
    <a href="/entry.html">Портал</a>
    <a href="/home.html">Кокпит</a>
    <a href="/sochiwood/index.html">Кинозал</a>
    <a href="/world-map.html" class="is-active">Карта</a>
    <a href="/profile.html">Профиль</a>
  </nav>


  <script src="/src/js/triznes-core-sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sdk = window.TRIZNES_SDK;
      const grid = document.getElementById('locationsGrid');
      sdk.REAL_SOCHI_LOCATIONS.forEach((loc) => {
        const el = document.createElement('article');
        el.className = 'tz-card';
        el.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="tz-badge" data-origin="${loc.origin}">${loc.origin} · ${loc.pillar}</span>
            <small style="font-size:11px;color:#8CEFFF;">${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}</small>
          </div>
          <h2 style="font-family:var(--tz-font-display);font-size:18px;margin:10px 0 6px;">${loc.name}</h2>
          <div style="font-size:13px;color:#FFD700;margin-bottom:8px;">${loc.address}</div>
          <p style="margin:0 0 12px;font-size:13px;color:#ABA3BC;">${loc.note}</p>
          <a class="tz-btn tz-btn--gold" href="/home.html">Взять квест этой точки →</a>
        `;
        grid.appendChild(el);
      });
    });
  </script>
</body>
</html>
