<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040B">
<meta name="robots" content="noindex">
<title>TRIZNES — согласие на публикацию</title>
<style>
:root{--pink:#FF35C8;--cyan:#42ECFF;--lime:#CAFF39;--gold:#F4CF7A;--bg:#07040B;--line:rgba(255,255,255,.1);--text:#F6F1FB;--muted:#AFA3C2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 50% at 80% -10%,rgba(255,53,200,.2),transparent 60%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:20px 16px 40px}
main{max-width:560px;margin:0 auto}
.logo{font-weight:900;letter-spacing:.08em;font-size:18px}.logo b{color:var(--pink)}
h1{font-size:24px;line-height:1.15;margin:18px 0 8px}
.muted{color:var(--muted)}
.card{border:1px solid var(--line);background:rgba(18,10,28,.8);border-radius:20px;padding:16px;margin:12px 0}
details{border-top:1px solid var(--line);padding:12px 0}details:first-of-type{border:0}
summary{cursor:pointer;font-weight:700;list-style:none}summary::before{content:"▸ ";color:var(--pink)}details[open] summary::before{content:"▾ "}
details p{white-space:pre-wrap;font-size:13.5px;color:#dcd3ea;margin-top:8px}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px}
label.ck input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--pink);margin-top:1px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;font:800 16px system-ui;color:#fff;background:linear-gradient(135deg,var(--pink),#9a3bff);margin-top:10px;cursor:pointer}
.btn[disabled]{opacity:.45}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-weight:700}
.ok{border-color:rgba(202,255,57,.4);background:rgba(202,255,57,.07)}
.st{min-height:20px;margin-top:10px;color:var(--gold);font-size:14px}
.foot{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
a{color:var(--cyan)}
</style>
</head>
<body>
<main>
  <div class="logo">TRIZ<b>NES</b></div>
  <div id="box"><p class="muted" style="margin-top:20px">Загружаю…</p></div>
  <p class="foot">Оператор персональных данных: ИП Глазунов Дмитрий Леонидович · ИНН 236600637037 · ОГРНИП 326237500269255<br><a href="./privacy.html">Политика обработки персональных данных</a> · вопросы: dan.k00@mail.ru</p>
</main>
<script>
const SB='https://bbxhhtpmbtgfaxamgksf.supabase.co',ANON='sb_publishable_aFTiVGlsJxeeutL_gEZaKA_S9VyKaHS';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=(location.hash.match(/t=([0-9a-f]{48})/)||[])[1]||'';
async function view(){const r=await fetch(SB+'/rest/v1/rpc/triznes_consent_view',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});return r.json()}
function done(dec){$('box').innerHTML=dec==='granted'?`<div class="card ok"><h1>Спасибо! ✅</h1><p>Согласие записано. Твои материалы выйдут в TRIZNES — ссылки пришлёт TRIZNES Assistant.</p><p class="muted" style="margin-top:8px">Отозвать согласие можно в любой момент: напиши TRIZNES Assistant или на dan.k00@mail.ru.</p></div>`:`<div class="card"><h1>Понятно</h1><p>Материалы с тобой публиковать не будем. Если передумаешь — напиши TRIZNES Assistant.</p></div>`}
async function submit(dec){const s=$('st');document.querySelectorAll('.btn').forEach(b=>b.disabled=true);s.textContent='Записываю…';
  try{const r=await fetch('/consent-api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,decision:dec})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'fail');done(d.decision||dec)}
  catch(e){s.textContent='Не получилось записать. Попробуй ещё раз через минуту или напиши TRIZNES Assistant.';document.querySelectorAll('.btn').forEach(b=>b.disabled=false);$('yes').disabled=!$('agree').checked}}
(async()=>{
  if(!token){$('box').innerHTML='<div class="card"><h1>Ссылка неполная</h1><p class="muted">Открой ссылку из сообщения TRIZNES Assistant целиком.</p></div>';return}
  let d;try{d=await view()}catch(e){$('box').innerHTML='<div class="card"><p>Нет связи. Обнови страницу.</p></div>';return}
  if(!d.ok){$('box').innerHTML='<div class="card"><h1>Ссылка не найдена</h1><p class="muted">Попроси новую у TRIZNES Assistant.</p></div>';return}
  if(d.status!=='pending'){done(d.status);return}
  if(d.expired){$('box').innerHTML='<div class="card"><h1>Срок ссылки истёк</h1><p class="muted">Попроси новую у TRIZNES Assistant.</p></div>';return}
  $('box').innerHTML=`<h1>${esc(d.name||'Игрок')}, нужно твоё согласие</h1>
  <p class="muted">Чтобы TRIZNES и PINK NOIZE PRODUCTION могли выпускать ролики и материалы с тобой, закон требует твоего отдельного согласия. Это одно нажатие.</p>
  ${d.note?`<div class="card"><b>О каких материалах речь</b><p class="muted" style="margin-top:4px">${esc(d.note)}</p></div>`:''}
  <div class="card">${(d.templates||[]).map(t=>`<details><summary>${esc(t.title)}</summary><p>${esc(t.body)}</p></details>`).join('')}</div>
  <label class="ck"><input type="checkbox" id="agree"><span>Я прочитал(а) тексты выше и даю все четыре согласия оператору ИП Глазунов Д.&nbsp;Л.</span></label>
  <button class="btn" id="yes" disabled>✅ Согласен(на)</button>
  <button class="btn ghost" id="no">Не согласен(на)</button>
  <div class="st" id="st"></div>`;
  $('agree').onchange=()=>$('yes').disabled=!$('agree').checked;
  $('yes').onclick=()=>submit('granted');$('no').onclick=()=>submit('declined');
})();
</script>
</body>
</html>
