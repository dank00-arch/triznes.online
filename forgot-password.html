<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09040f">
<title>TRIZNES · Сброс пароля</title>
<style>
:root{color-scheme:dark;--bg:#07040b;--panel:#100d16;--line:#32263d;--muted:#a69dad;--cyan:#42ecff;--pink:#ff35c8;--green:#72ffad;--red:#ff7895}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 13% 0,rgba(255,53,200,.18),transparent 30%),radial-gradient(circle at 90% 5%,rgba(66,236,255,.14),transparent 28%),var(--bg);color:#f8f7fb;font:15px/1.45 system-ui,-apple-system,sans-serif}.card{width:min(520px,100%);border:1px solid var(--line);background:rgba(16,13,22,.97);border-radius:24px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.ey{font:900 10px ui-monospace,monospace;letter-spacing:.18em;color:var(--cyan)}h1{font-size:34px;line-height:1;margin:8px 0 10px;letter-spacing:-.04em}.muted{color:var(--muted)}label{display:block;margin:14px 0 6px;font-weight:800}input{width:100%;border:1px solid #3b3045;background:#08070c;color:#fff;border-radius:12px;padding:13px;font:inherit}button,a.btn{width:100%;min-height:50px;border:0;border-radius:13px;margin-top:12px;padding:0 16px;background:linear-gradient(110deg,var(--pink),var(--cyan));color:#05070a;font-weight:900;font:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.secondary{background:#17131d!important;color:#fff!important;border:1px solid #3b3045!important}.status{margin-top:14px;padding:12px;border-radius:12px;background:#09070d;border:1px solid #30273a}.ok{border-color:rgba(114,255,173,.45);color:var(--green)}.bad{border-color:rgba(255,120,149,.45);color:var(--red)}.hide{display:none!important}.small{font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main class="card">
<div class="ey">TRIZNES / SECURE ACCESS</div>
<h1>Сброс пароля</h1>
<p class="muted">Отправим официальную ссылку восстановления Supabase Auth на Gmail. Пароль в TRIZNES не передаётся.</p>
<form id="form">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="email" required value="pinknoize2@gmail.com">
<button id="send" type="submit">ОТПРАВИТЬ ПИСЬМО</button>
</form>
<div id="status" class="status hide"></div>
<a class="btn secondary" href="register.html">← ВЕРНУТЬСЯ К ВХОДУ</a>
<p class="muted small">Открывай только самое свежее письмо восстановления. Новый пароль задаётся на странице TRIZNES после перехода по ссылке из письма.</p>
</main>
<script>
const SUPABASE_URL='https://bbxhhtpmbtgfaxamgksf.supabase.co';
const KEY='sb_publishable_aFTiVGlsJxeeutL_gEZaKA_S9VyKaHS';
const REDIRECT='https://dank00-arch.github.io/triznes.online/neuroferma-reset-password.html';
const form=document.getElementById('form'),email=document.getElementById('email'),send=document.getElementById('send'),status=document.getElementById('status');
const q=new URLSearchParams(location.search);if(q.get('email'))email.value=q.get('email');
function show(msg,ok=false){status.textContent=msg;status.className='status '+(ok?'ok':'bad')}
form.addEventListener('submit',async e=>{e.preventDefault();const value=email.value.trim().toLowerCase();if(!value)return;send.disabled=true;send.textContent='ОТПРАВЛЯЮ…';status.classList.add('hide');try{const r=await fetch(SUPABASE_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(REDIRECT),{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||'Не удалось отправить письмо');show('Готово. Проверь Gmail и открой самое свежее письмо восстановления.',true);send.textContent='ОТПРАВИТЬ ЕЩЁ РАЗ'}catch(err){show(String(err.message||err));send.textContent='ПОПРОБОВАТЬ ЕЩЁ РАЗ'}finally{send.disabled=false}});
</script>
</body>
</html>
