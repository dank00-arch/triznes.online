<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07050b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Игровой Пульт"><link rel="manifest" href="./pult.webmanifest?v=20261029-pult2"><link rel="icon" href="./pult-icon.png?v=20261029-pult2" type="image/png"><link rel="apple-touch-icon" href="./pult-icon.png?v=20261029-pult2"><title>TRIZNES · Игровой Пульт</title>
<style>
:root{color-scheme:dark;--bg:#07050b;--panel:#11101a;--line:rgba(255,255,255,.11);--text:#fff;--mut:#aaa5b5;--pink:#ff3cc7;--cyan:#42efff;--lime:#caff39;--gold:#ffd66b;--red:#ff6477;--violet:#9c72ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(156,114,255,.22),transparent 28%),radial-gradient(circle at 90% 18%,rgba(66,239,255,.12),transparent 24%),var(--bg);color:var(--text);font:15px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1050px,calc(100% - 18px));margin:auto;padding:calc(14px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;padding:8px 0 12px;background:linear-gradient(var(--bg),rgba(7,5,11,.82),transparent);backdrop-filter:blur(14px)}.brand{font:950 11px ui-monospace,monospace;letter-spacing:.16em}.tag,.pill{border:1px solid var(--line);border-radius:999px}.tag{padding:7px 10px;color:var(--cyan);font:800 10px ui-monospace,monospace}.hero,.card{background:rgba(17,16,26,.9);border:1px solid var(--line);backdrop-filter:blur(18px)}.hero{border-radius:28px;padding:22px}.ey{font:900 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--cyan)}h1{font-size:clamp(38px,8vw,70px);line-height:.9;letter-spacing:-.055em;margin:8px 0 10px}.mut{color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}.kpi{padding:12px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.kpi b{display:block;font-size:25px}.kpi span{font-size:11px;color:var(--mut)}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 10px;position:sticky;top:52px;z-index:15;background:rgba(7,5,11,.88);backdrop-filter:blur(16px)}button,input{font:inherit}button{appearance:none;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#171522;color:var(--text);font-weight:850}.tabs button.on{border-color:var(--cyan);color:var(--cyan)}.cards{display:grid;gap:9px}.card{border-radius:20px;padding:15px}.sev-high,.sev-critical{border-color:rgba(255,100,119,.5)}.sev-medium{border-color:rgba(255,214,107,.35)}.title{font-size:18px;font-weight:900;letter-spacing:-.025em}.meta{font:800 10px ui-monospace,monospace;color:var(--mut);margin:4px 0 10px}.next{border-left:2px solid var(--cyan);padding-left:10px;margin:10px 0;color:var(--mut)}.row{display:flex;gap:7px;flex-wrap:wrap}.go{border-color:rgba(66,239,255,.35);color:var(--cyan)}.done{border-color:rgba(202,255,57,.35);color:var(--lime)}.login{width:min(440px,calc(100% - 24px));margin:14vh auto 0}.login input{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);outline:none}.login button{width:100%;margin-top:10px;background:linear-gradient(115deg,var(--pink),var(--violet),var(--cyan));border:0}.hidden{display:none!important}.empty{text-align:center;color:var(--mut);padding:28px}.pill{display:inline-flex;padding:4px 7px;font:800 9px ui-monospace,monospace;margin-right:4px}.high,.critical{color:var(--red)}.medium{color:var(--gold)}.sys{margin-top:8px;font-size:12px;color:var(--mut)}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:18px}.tag{max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style>
</head>
<body>
<section id="login" class="login"><div class="hero"><div class="ey">TRIZNES / ВХОД ОПЕРАТОРА</div><h1 style="font-size:42px">ЦЕНТР<br>УПРАВЛЕНИЯ</h1><p class="mut">Те же имя/ник и код, что на платформе TRIZNES.</p><input id="name" autocomplete="username" placeholder="Имя / ник"><input id="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Код входа"><button id="loginBtn">Войти</button><div id="loginMsg" class="sys"></div></div></section>
<main id="app" class="wrap hidden"><header class="top"><div class="brand">TRIZNES / LIFE IN THE GAME</div><div id="operator" class="tag">ОПЕРАТОР</div></header><section class="hero"><div class="ey">ЖИВОЙ ПУЛЬТ ЭКОСИСТЕМЫ</div><h1>ЧТО ТРЕБУЕТ<br>РЕШЕНИЯ?</h1><p class="mut">Люди, доступы, контент, Нейроферма и игра — в одном месте.</p><div class="grid"><div class="kpi"><b id="kHigh">0</b><span>СРОЧНО</span></div><div class="kpi"><b id="kSignals">0</b><span>СИГНАЛОВ</span></div><div class="kpi"><b id="kPeople">0</b><span>ЛЮДЕЙ</span></div><div class="kpi"><b id="kContent">0</b><span>КОНТЕНТ</span></div><div class="kpi"><b id="kGame">0</b><span>В ИГРЕ</span></div></div></section><nav class="tabs"><button class="on" data-tab="signals">🚨 Сейчас</button><button data-tab="people">👥 Люди</button><button data-tab="content">🎬 Контент</button><button data-tab="game">🎭 Игра</button></nav><section id="panel" class="cards"></section></main>
<script>
const BASE='https://bbxhhtpmbtgfaxamgksf.supabase.co',PORTAL=BASE+'/functions/v1/neurofarm-member-portal',RPC=BASE+'/rest/v1/rpc/triznes_control_api',KEY='sb_publishable_aFTiVGlsJxeeutL_gEZaKA_S9VyKaHS';
const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let TOKEN=localStorage.getItem('triznes-control-session')||'',DATA=null,TAB='signals';const labels={access_registration:'Доступ / регистрация',content_request:'Запрос контента',content_stalled:'Контент завис',neurofarm_stalled:'Нейроферма',publication:'Публикация',people:'Люди',event:'Событие'};
async function portalLogin(name,code){const r=await fetch(PORTAL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',name,code})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'invalid_credentials');return d}
async function rpc(action,payload={}){const r=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({p_action:action,p_session_token:TOKEN,p_payload:payload})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||('http_'+r.status));return d}
async function login(){const b=$('loginBtn');b.disabled=true;$('loginMsg').textContent='Вхожу…';try{const d=await portalLogin($('name').value.trim(),$('code').value.trim());TOKEN=d.session_token;localStorage.setItem('triznes-control-session',TOKEN);await boot()}catch(e){$('loginMsg').textContent=e.message==='operator_access_required'?'Для этого профиля не выданы операторские права.':'Не удалось войти: '+e.message}finally{b.disabled=false}}
function k(){const c=DATA.counts;$('kHigh').textContent=c.high;$('kSignals').textContent=c.signals;$('kPeople').textContent=c.people;$('kContent').textContent=c.content_active;$('kGame').textContent=c.game_active;$('operator').textContent=(DATA.operator.name||'ОПЕРАТОР')+' · '+(DATA.operator.role||'TRIZNES')}
function signalCard(x){return `<article class="card sev-${esc(x.severity)}"><div><span class="pill ${esc(x.severity)}">${esc((x.severity||'normal').toUpperCase())}</span><span class="pill">${esc(labels[x.category]||x.category)}</span><span class="pill">${esc(x.status)}</span></div><div class="title" style="margin-top:9px">${esc(x.title||x.display_name||'Сигнал')}</div><div class="meta">${esc(x.display_name||'')} · ${esc(new Date(x.detected_at).toLocaleString('ru-RU'))}</div><div>${esc(x.summary||'')}</div>${x.next_action?`<div class="next"><b>Следующий шаг:</b> ${esc(x.next_action)}</div>`:''}<div class="row"><button class="go" data-id="${x.id}" data-status="in_progress">В работу</button><button class="done" data-id="${x.id}" data-status="resolved">Решено</button></div></article>`}
function bind(){document.querySelectorAll('[data-id][data-status]').forEach(b=>b.onclick=()=>setSignal(b.dataset.id,b.dataset.status))}
function paint(){const p=$('panel');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));if(TAB==='signals'){p.innerHTML=DATA.signals.length?DATA.signals.map(signalCard).join(''):'<div class="empty">Открытых сигналов нет.</div>';bind();return}if(TAB==='people'){p.innerHTML=DATA.people.map(x=>`<article class="card"><div class="title">${esc(x.creative_alias||x.display_name||'Участник')}</div><div class="meta">${esc(x.role||'')} · ${esc(x.registration_status||'')}</div><div class="mut">Обновлено: ${esc(new Date(x.updated_at).toLocaleString('ru-RU'))}</div></article>`).join('')||'<div class="empty">Нет данных.</div>';return}if(TAB==='content'){p.innerHTML=DATA.jobs.map(x=>`<article class="card"><div><span class="pill">${esc(x.status)}</span><span class="pill">${esc(x.job_kind||'content')}</span></div><div class="title" style="margin-top:8px">${esc(x.title)}</div><div class="meta">${esc(new Date(x.updated_at).toLocaleString('ru-RU'))}</div><div class="mut">${x.result_url?'Результат готов':'Результат ещё не зафиксирован'}</div></article>`).join('')||'<div class="empty">Нет контента.</div>';return}p.innerHTML=DATA.game_sessions.map(x=>`<article class="card"><div><span class="pill">${esc((x.agent_slug||'game').toUpperCase())}</span><span class="pill">LEVEL ${esc(x.level_no)}</span><span class="pill">${esc(x.status)}</span></div><div class="title" style="margin-top:8px">${esc(x.title||'Игровая сессия')}</div><div class="next">${esc(x.mission||'')}</div><div class="meta">Шаг ${esc(x.current_step||1)} · ${esc(new Date(x.updated_at).toLocaleString('ru-RU'))}</div></article>`).join('')||'<div class="empty">Сейчас активных игровых сессий нет.</div>'}
async function setSignal(id,status){try{await rpc('signal_update',{signal_id:id,status});await refresh()}catch(e){alert('Не удалось обновить: '+e.message)}}async function refresh(){const d=await rpc('bootstrap');DATA=d.data;k();paint()}async function boot(){try{await refresh();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){if(['session_required','operator_access_required','player_not_found'].includes(e.message)){localStorage.removeItem('triznes-control-session');TOKEN='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=e.message==='operator_access_required'?'Для этого профиля не выданы операторские права.':''}else $('loginMsg').textContent='Ошибка: '+e.message}}
$('loginBtn').onclick=login;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;paint()});if(TOKEN)boot();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./triznes-sw.js?v=20261029-pult1',{updateViaCache:'none'}).catch(()=>{});</script></body></html>
