name: Participant access
on:
  pull_request:
    paths: ['register.html', 'app/js/app.js', 'app/index.html', 'app/sw.js', 'tests/participant-access.test.cjs', '.github/workflows/participant-access-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app/js/app.js
      - run: node --check app/sw.js
      - run: node --test tests/participant-access.test.cjs
