name: Build TRIZNES Neurofarm APK

on:
  push:
    branches:
      - app/neurofarm-android
    paths:
      - 'android/**'
      - '.github/workflows/build-neurofarm-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/TRIZNES-Neurofarm-v0.1.0.apk
          sha256sum dist/TRIZNES-Neurofarm-v0.1.0.apk > dist/TRIZNES-Neurofarm-v0.1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIZNES-Neurofarm-v0.1.0-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
