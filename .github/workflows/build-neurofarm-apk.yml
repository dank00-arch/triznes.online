name: Build TRIZNES Neurofarm APK

on:
  push:
    branches:
      - app/neurofarm-android
    paths:
      - 'android/**'
      - '.github/workflows/build-neurofarm-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android sdkmanager
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under /usr/local/lib/android/sdk/cmdline-tools" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"

      - name: Accept Android licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android 35 SDK
        shell: bash
        run: "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/TRIZNES-Neurofarm-v0.1.0.apk
          sha256sum dist/TRIZNES-Neurofarm-v0.1.0.apk > dist/TRIZNES-Neurofarm-v0.1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIZNES-Neurofarm-v0.1.0-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
