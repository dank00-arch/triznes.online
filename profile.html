<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>TRIZNES — Мой профиль</title>
<style>
:root{--bg:#05070b;--panel:#0d1018;--line:rgba(255,255,255,.1);--cyan:#78f4ff;--pink:#ff5ba8;--gold:#f1ce79;--muted:#8993a2;--text:#f7f9fc;--green:#83e9bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 13% 8%,rgba(93,45,149,.29),transparent 30%),radial-gradient(circle at 88% 38%,rgba(0,143,164,.18),transparent 31%),#05070b;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:24px 0 54px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.logo{font-weight:900;letter-spacing:.22em;font-size:13px}.sys{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan);letter-spacing:.12em}.hero,.box{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,20,31,.93),rgba(9,11,18,.94));box-shadow:0 24px 80px rgba(0,0,0,.28)}.hero{position:relative;overflow:hidden;border-radius:30px;padding:32px}.hero:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--pink),var(--cyan),transparent)}.kicker{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--gold)}h1{font-size:clamp(36px,7vw,68px);line-height:.95;letter-spacing:-.055em;margin:13px 0 10px}.alias{font-size:17px;color:#c6cbd5}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.badge{padding:8px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.1);font:700 10px ui-monospace,monospace;letter-spacing:.06em;color:#cbd1da}.badge.gold{color:var(--gold);border-color:rgba(241,206,121,.28);background:rgba(241,206,121,.06)}.badge.green{color:var(--green);border-color:rgba(131,233,189,.2);background:rgba(131,233,189,.04)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}.box{border-radius:23px;padding:22px}.box h2{margin:0 0 14px;font-size:16px;letter-spacing:-.02em}.muted{color:var(--muted);font-size:12px;line-height:1.5}.summary{font-size:16px;line-height:1.68;color:#d9dee7;white-space:pre-wrap}.facts{display:grid;gap:9px}.fact{padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);font-size:13px;line-height:1.48;color:#d2d7df}.row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.065);font-size:13px}.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted)}.row span:last-child{color:#e5e9f0;overflow-wrap:anywhere}.stateGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stateItem{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);border-radius:15px;padding:13px}.stateItem b{display:block;margin-bottom:7px;font:700 10px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}.stateItem div{font-size:13px;line-height:1.5;color:#d4dae3;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a.btn{border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.04);color:white;padding:11px 14px;font:700 12px inherit;cursor:pointer;text-decoration:none}.primary{border-color:rgba(120,244,255,.25)!important;color:var(--cyan)!important}.danger{color:#ff9dbd!important}.empty{padding:18px;border:1px dashed rgba(255,255,255,.13);border-radius:15px;color:#9099a7;font-size:13px;line-height:1.55}.loading{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.pulse{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 24px var(--cyan);margin:0 auto 14px;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.stateGrid{grid-template-columns:1fr}.hero{padding:25px 20px}.box{padding:19px}.row{grid-template-columns:100px 1fr}.top{margin-bottom:14px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div><div class="pulse"></div>Собираю твой профиль TRIZNES…</div></div></div>
<script>
const API='https://bbxhhtpmbtgfaxamgksf.supabase.co/functions/v1/triznes-platform-access';
const SESSION_KEY='triznes-platform-session';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function call(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function fmtDate(v){if(!v)return'—';try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(v))}catch{return'—'}}
function prettyKey(k){const m={dream:'Мечта',goals:'Цели',projects:'Проекты',creative_roles:'Творческие роли',favorite_colors:'Любимые цвета',style_preferences:'Стиль',strengths:'Сильные стороны',next_desired_step:'Следующий желаемый шаг',idea:'Идея',ideas:'Идеи',interests:'Интересы',skills:'Навыки'};return m[k]||String(k).replaceAll('_',' ')}
function prettyVal(v){if(v==null)return'';if(Array.isArray(v))return v.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' · ');if(typeof v==='object')return Object.entries(v).map(([k,x])=>`${prettyKey(k)}: ${prettyVal(x)}`).join('\n');return String(v)}
function maskCode(v){const s=String(v||'');return s.length>7?s.slice(0,3)+'•••'+s.slice(-3):s}
function render(d){const p=d.player||{},c=d.card||{},profile=d.profile||{},st=profile.state&&typeof profile.state==='object'?profile.state:{},confirmation=d.profile_confirmation||{},isConfirmed=confirmation.matches_current===true;const facts=Array.isArray(st.facts)?st.facts:[];const hidden=new Set(['facts','apollon_profile_updated_at','active_protocol','active_protocol_since']);const stateItems=Object.entries(st).filter(([k,v])=>!hidden.has(k)&&v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)).slice(0,20);app.innerHTML=`
<div class="top"><div class="logo">TRIZNES</div><div class="sys">LIVE PROFILE / APOLLON MEMORY</div></div>
<section class="hero">
  <div class="kicker">PLAYER PROFILE</div>
  <h1>${esc(p.display_name||c.owner_name||'TRIZNES PLAYER')}</h1>
  ${p.creative_alias?`<div class="alias">${esc(p.creative_alias)}</div>`:''}
  <div class="badges">
    <div class="badge gold">✦ ${esc(String(c.tier||'BLACK').toUpperCase())} · ACTIVE</div>
    ${p.role?`<div class="badge">${esc(p.role)}</div>`:''}
    ${p.active_node?`<div class="badge">${esc(p.active_node)}</div>`:''}
    <div class="badge green">PROFILE CONNECTED</div>
  </div>
</section>
<div class="grid">
  <section class="box">
    <h2>Что уже знает Аполлон</h2>
    ${profile.summary?`<div class="summary">${esc(profile.summary)}</div>`:`<div class="empty">Профиль уже активен, но Аполлон пока собрал мало информации. Просто продолжай естественный разговор с ним — здесь будут появляться твои идеи, цели, роли и предпочтения.</div>`}
  </section>
  <section class="box">
    <h2>Доступ</h2>
    <div class="row"><span>Карта</span><span>${esc(String(c.tier||'BLACK').toUpperCase())}</span></div>
    <div class="row"><span>Владелец</span><span>${esc(c.owner_name||p.display_name||'—')}</span></div>
    <div class="row"><span>Код карты</span><span>${esc(maskCode(c.card_code))}</span></div>
    <div class="row"><span>Активна до</span><span>${esc(fmtDate(c.expires_at))}</span></div>
    <div class="row"><span>Профиль с</span><span>${esc(fmtDate(p.registered_at))}</span></div>
  </section>
</div>
<div class="grid">
  <section class="box">
    <h2>Живая память</h2>
    ${facts.length?`<div class="facts">${facts.slice(-20).reverse().map(x=>`<div class="fact">${esc(x)}</div>`).join('')}</div>`:`<div class="empty">Устойчивые факты появятся здесь после разговоров с Аполлоном.</div>`}
  </section>
  <section class="box">
    <h2>Структура персонажа</h2>
    ${stateItems.length?`<div class="stateGrid">${stateItems.map(([k,v])=>`<div class="stateItem"><b>${esc(prettyKey(k))}</b><div>${esc(prettyVal(v))}</div></div>`).join('')}</div>`:`<div class="empty">Пока без дополнительных полей. Аполлон заполнит их постепенно из живого общения.</div>`}
  </section>
</div>
<section class="box" style="margin-top:16px">
  <h2>Подтверждение твоего образа</h2>
  <div class="muted">Аполлон помогает собрать и уточнить твой образ. Проверь имя, описание и структуру персонажа выше. Если всё отражает твой замысел, подтверди образ; если что-то нужно изменить — продолжи разговор с Аполлоном, а затем обнови профиль здесь.</div>
  <div class="actions"><span class="badge ${isConfirmed?'green':'gold'}">${isConfirmed?'ОБРАЗ ПОДТВЕРЖДЁН':'НУЖНО ПОДТВЕРДИТЬ'}</span>${confirmation.confirmed_at?`<span class="muted">${isConfirmed?'Подтверждён':'После подтверждения обновился'} · ${esc(fmtDate(confirmation.confirmed_at))}</span>`:''}</div>
  ${isConfirmed?'':`<label class="muted" style="display:flex;gap:9px;align-items:flex-start;margin-top:14px"><input type="checkbox" id="confirm-check" style="accent-color:#78f4ff;margin-top:2px"> Я проверил информацию и подтверждаю, что это мой профиль и мой текущий творческий замысел.</label>`}
  <div class="actions">${isConfirmed?'':`<button class="primary" id="confirm-profile">Подтвердить мой образ</button>`}<button class="primary" id="refresh">Обновить профиль</button><button class="danger" id="logout">Выйти</button></div>
  <div id="confirm-status" class="muted" style="margin-top:10px"></div>
  <div class="muted" style="margin-top:12px">Личный код позволяет возвращаться в свой профиль и открытые разделы платформы. Чужие личные данные, исходники и закрытые проекты доступны только с разрешения владельца. Код можно использовать повторно; выход завершит текущий сеанс.</div>
</section>`;
app.insertAdjacentHTML('beforeend',`<section class="box" style="margin-top:16px"><h2>Открытые двери TRIZNES</h2><div class="muted">Общие страницы и публичные профили доступны всем участникам. Личные материалы других людей остаются только у них и у тех, кому они открыли доступ.</div><div class="actions"><a class="btn primary" href="sochi-game.html">Персонажи и ИГРА</a><a class="btn primary" href="sochi-news.html">События и РАЙ</a><a class="btn" href="index.html">Главная TRIZNES</a></div></section>`);
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=logout;const confirmButton=document.getElementById('confirm-profile');if(confirmButton)confirmButton.onclick=confirmProfile}
async function load(){const token=localStorage.getItem(SESSION_KEY);if(!token){location.replace('register.html');return}try{render(await call({action:'status',session_token:token}))}catch(e){localStorage.removeItem(SESSION_KEY);location.replace('register.html')}}
async function confirmProfile(){const check=document.getElementById('confirm-check'),status=document.getElementById('confirm-status'),button=document.getElementById('confirm-profile');if(!check?.checked){status.textContent='Сначала отметь подтверждение после проверки своего образа.';return}button.disabled=true;status.textContent='Сохраняю подтверждение…';try{const token=localStorage.getItem(SESSION_KEY);await call({action:'confirm_profile',session_token:token});await load()}catch(e){status.textContent='Не удалось сохранить подтверждение. Попробуй обновить страницу.';button.disabled=false}}
async function logout(){const token=localStorage.getItem(SESSION_KEY);try{if(token)await call({action:'logout',session_token:token})}catch{}localStorage.removeItem(SESSION_KEY);location.replace('register.html')}
load();
</script>
</body>
</html>
